# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c62b5441aecbc8145898c9830bdf5520"
application_url = "https://example.com"
embedded = true
name = "Stable Custom Filter & Search"

[access_scopes]
# read_products      — products, variants, options, collections, product metafields
# read_inventory     — availability filtering
# unauthenticated_*  — required for the app-owned Storefront API token used by the
#                      filtering engine (CLAUDE.md §6.1)
scopes = "read_products,read_inventory,unauthenticated_read_product_listings,unauthenticated_read_product_tags,unauthenticated_read_collection_listings,unauthenticated_read_product_inventory"

# Storefront requests are proxied through the app so credentials never reach the
# browser. /apps/scfs/<x> -> <application_url>/proxy/<x>  (CLAUDE.md §6.3)
[app_proxy]
url = "https://example.com/proxy"
subpath = "scfs"
prefix = "apps"

[webhooks]
# Keep in sync with API_VERSION in app/shopify.server.ts and .graphqlrc.js
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/update"
  topics = [ "collections/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/delete"
  topics = [ "collections/delete" ]

  # Mandatory compliance topics (CLAUDE.md §6.5). These are declared with
  # `compliance_topics`, not `topics` — Shopify rejects them as invalid topics
  # otherwise. Public apps only.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
